name: Validate research portal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Install Jekyll
        run: gem install jekyll -v '~> 3.10' --no-document
      - name: Check source structure and scholarly cautions
        run: python3 scripts/validate_portal.py
      - name: Build Jekyll site
        run: jekyll build --destination _site
      - name: Check rendered site
        run: python3 scripts/validate_portal.py --rendered _site
